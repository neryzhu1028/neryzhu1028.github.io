<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艾斯利网站 · 后台管理系统</title>
<style>
  :root {
    --pri: #4F46E5;
    --pri-soft: #EEF2FF;
    --bg: #F3F4F6;
    --card: #FFFFFF;
    --border: #E5E7EB;
    --text: #1F2937;
    --text-soft: #6B7280;
    --ok: #059669;
    --err: #DC2626;
    --warn: #D97706;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  a { color: var(--pri); text-decoration: none; }

  /* ---- 顶部工具条 ---- */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: #fff; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; padding: 10px 20px;
    flex-wrap: wrap;
  }
  .topbar .logo { font-weight: 800; font-size: 16px; color: var(--pri); margin-right: 8px; }
  .topbar .logo small { color: var(--text-soft); font-weight: 400; }
  .topbar .spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--border); background: #fff; color: var(--text);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--pri); color: var(--pri); }
  .btn.primary { background: var(--pri); border-color: var(--pri); color: #fff; }
  .btn.primary:hover { background: #4338CA; }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.ok:hover { background: #047857; }
  .btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
  .btn.danger { color: var(--err); }
  .btn.danger:hover { border-color: var(--err); background: #FEF2F2; }
  .conn-state { font-size: 12px; color: var(--text-soft); }
  .conn-state .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .dot.green { background: var(--ok); }
  .dot.gray { background: #9CA3AF; }

  /* ---- 布局 ---- */
  .layout { display: flex; min-height: calc(100vh - 52px); }
  .sidebar {
    width: 210px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--border);
    padding: 12px 8px; position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto;
  }
  .sidebar button {
    display: block; width: 100%; text-align: left; padding: 10px 12px;
    border: none; background: none; border-radius: 8px; font-size: 13px; color: var(--text);
    cursor: pointer; margin-bottom: 2px;
  }
  .sidebar button:hover { background: var(--pri-soft); }
  .sidebar button.active { background: var(--pri); color: #fff; font-weight: 600; }
  .sidebar .group-label { font-size: 11px; color: var(--text-soft); padding: 14px 12px 4px; font-weight: 700; }
  .main { flex: 1; padding: 24px; max-width: 1100px; }

  /* ---- 表单 ---- */
  .panel {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; margin-bottom: 20px;
  }
  .panel h2 { font-size: 17px; margin-bottom: 4px; }
  .panel .hint { color: var(--text-soft); font-size: 12px; margin-bottom: 16px; line-height: 1.6; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .field label .opt { color: var(--text-soft); font-weight: 400; font-size: 12px; }
  .field input[type="text"], .field input[type="url"], .field input[type="email"],
  .field input[type="number"], .field textarea, .field select {
    width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; font-family: inherit; background: #fff; color: var(--text);
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none; border-color: var(--pri); box-shadow: 0 0 0 3px rgba(79,70,229,.12);
  }
  .field textarea { resize: vertical; min-height: 64px; line-height: 1.6; }
  .field .char { font-size: 11px; color: #9CA3AF; text-align: right; margin-top: 2px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .row4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }

  /* ---- 列表项 ---- */
  .item {
    border: 1px solid var(--border); border-radius: 10px; padding: 14px;
    margin-bottom: 12px; background: #FBFBFC; position: relative;
  }
  .item .item-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    font-size: 12px; color: var(--text-soft); font-weight: 600;
  }
  .item .item-head .idx { background: var(--pri-soft); color: var(--pri); padding: 2px 8px; border-radius: 999px; }
  .item .item-actions { margin-left: auto; display: flex; gap: 6px; }
  .add-btn {
    width: 100%; padding: 10px; border: 2px dashed var(--border); background: none;
    border-radius: 10px; color: var(--pri); font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .add-btn:hover { border-color: var(--pri); background: var(--pri-soft); }

  /* ---- 图片上传 ---- */
  .upload-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .upload-row .thumb {
    width: 64px; height: 48px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--pri-soft); display: flex; align-items: center; justify-content: center;
    font-size: 20px; overflow: hidden; flex-shrink: 0;
  }
  .upload-row .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .upload-row .path { font-size: 11px; color: var(--text-soft); word-break: break-all; flex: 1; min-width: 120px; }
  .spec { font-size: 11px; color: var(--text-soft); margin-top: 4px; line-height: 1.5; }

  /* ---- 提示条 ---- */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #111827; color: #fff; padding: 12px 20px; border-radius: 10px;
    font-size: 13px; z-index: 999; transition: transform .25s; box-shadow: 0 8px 24px rgba(0,0,0,.2);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.ok { background: var(--ok); }
  .toast.err { background: var(--err); }

  /* ---- 规格速查 ---- */
  .spec-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .spec-table th, .spec-table td { border: 1px solid var(--border); padding: 10px 12px; text-align: left; vertical-align: top; }
  .spec-table th { background: var(--pri-soft); font-weight: 700; white-space: nowrap; width: 130px; }
  .spec-table code { background: #F3F4F6; padding: 1px 6px; border-radius: 4px; font-size: 12px; }

  /* ---- 步骤 ---- */
  .steps { counter-reset: step; }
  .step { display: flex; gap: 12px; margin-bottom: 14px; }
  .step .num {
    counter-increment: step; width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: var(--pri); color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }
  .step .body { font-size: 13px; line-height: 1.7; }
  .step .body b { display: block; margin-bottom: 2px; }

  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; position: static; height: auto; display: flex; flex-wrap: wrap; gap: 4px; }
    .sidebar .group-label { width: 100%; }
    .sidebar button { width: auto; }
    .row, .row3, .row4 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">⚙️ 网站后台 <small>艾斯利个人网页内容管理</small></span>
  <span class="conn-state" id="conn-state"><span class="dot gray"></span>未连接文件夹</span>
  <span class="spacer"></span>
  <button class="btn" id="btn-connect">📁 连接网站文件夹</button>
  <button class="btn" id="btn-load">🔄 重新加载</button>
  <button class="btn" id="btn-preview" title="在新标签打开网站预览">👁 预览网站</button>
  <button class="btn ok" id="btn-save">💾 保存修改</button>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="group-label">基础信息</div>
    <button data-panel="site">🌐 站点信息</button>
    <button data-panel="hero">🏠 Hero 首屏</button>
    <div class="group-label">内容模块</div>
    <button data-panel="projects">📁 精选项目</button>
    <button data-panel="courses">📚 课程</button>
    <button data-panel="videos">🎬 旅拍视频</button>
    <button data-panel="unboxing">📦 产品开箱</button>
    <button data-panel="about">👤 关于我</button>
    <div class="group-label">帮助</div>
    <button data-panel="guide">📖 素材规格 & 发布指南</button>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ================= 状态 ================= */
  var CONTENT = null;          // 当前编辑的数据模型
  var DIR = null;              // File System Access 目录句柄（网站根目录）
  var dirty = false;

  var $ = function (id) { return document.getElementById(id); };

  /* ================= 工具 ================= */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function toast(msg, type) {
    var t = $("toast");
    t.textContent = msg;
    t.className = "toast show" + (type ? " " + type : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = "toast"; }, 2600);
  }
  function deepClone(o) { return JSON.parse(JSON.stringify(o)); }
  function getPath(obj, path) {
    return path.split(".").reduce(function (o, k) {
      return o == null ? undefined : o[k];
    }, obj);
  }
  function setPath(obj, path, val) {
    var keys = path.split(".");
    var last = keys.pop();
    var o = obj;
    keys.forEach(function (k) {
      if (o[k] == null) o[k] = {};
      o = o[k];
    });
    o[last] = val;
  }

  /* ================= 文件系统 ================= */
  function fsSupported() {
    return "showDirectoryPicker" in window;
  }

  $("btn-connect").addEventListener("click", async function () {
    if (!fsSupported()) {
      toast("当前浏览器不支持连接文件夹，请用 Chrome / Edge 打开本页面", "err");
      return;
    }
    try {
      DIR = await window.showDirectoryPicker({ mode: "readwrite" });
      // 校验是否为网站根目录
      var probe = null;
      try { probe = await DIR.getFileHandle("data/content.json"); } catch (e) {}
      if (!probe) {
        toast("请选择「个人网页」网站根目录（内含 index.html 的文件夹）", "err");
        DIR = null;
        return;
      }
      $("conn-state").innerHTML = '<span class="dot green"></span>已连接：' + esc(DIR.name);
      toast("文件夹连接成功！可直接保存", "ok");
      await loadFromDir();
    } catch (e) {
      if (e.name !== "AbortError") toast("连接失败：" + e.message, "err");
    }
  });

  async function readFile(handle) {
    var f = await handle.getFile();
    return f.text();
  }
  async function writeFile(handle, text) {
    var w = await handle.createWritable();
    await w.write(text);
    await w.close();
  }
  async function writeImage(dirHandle, name, blob) {
    var w = await dirHandle.createWritable();
    await w.write(blob);
    await w.close();
  }

  async function loadFromDir() {
    try {
      var h = await DIR.getFileHandle("data/content.json");
      CONTENT = JSON.parse(await readFile(h));
      dirty = false;
      renderAllPanels();
      toast("已从文件夹加载最新内容", "ok");
    } catch (e) {
      toast("读取 data/content.json 失败：" + e.message, "err");
    }
  }

  /* ================= 数据加载（HTTP 方式） ================= */
  async function loadViaFetch() {
    try {
      var res = await fetch("../data/content.json", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      CONTENT = JSON.parse(await res.text());
      dirty = false;
      renderAllPanels();
    } catch (e) {
      toast("无法读取 data/content.json：" + e.message + "（请通过 http://localhost 打开，或点「连接网站文件夹」）", "err");
    }
  }

  /* ================= 保存 ================= */
  $("btn-save").addEventListener("click", async function () {
    if (!CONTENT) { toast("请先加载内容", "err"); return; }
    var text = JSON.stringify(CONTENT, null, 2);
    if (DIR) {
      try {
        // 备份旧文件
        try {
          var old = await DIR.getFileHandle("data/content.json");
          var backup = await DIR.getFileHandle("data/content.backup.json", { create: true });
          await writeFile(backup, await readFile(old));
        } catch (e) {}
        var target = await DIR.getFileHandle("data/content.json", { create: true });
        await writeFile(target, text);
        dirty = false;
        toast("✅ 已保存到 data/content.json（旧版本已备份为 content.backup.json）", "ok");
      } catch (e) {
        toast("保存失败：" + e.message, "err");
      }
    } else {
      // 降级：下载文件
      var blob = new Blob([text], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "content.json";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      toast("已下载 content.json —— 请放入网站 data/ 目录，或在 WorkBuddy 中让我更新", "ok");
    }
  });

  /* ================= 图片上传组件 ================= */
  function makeUploader(panelId, dataPath, opts) {
    opts = opts || {};
    var maxBytes = opts.maxBytes || 10 * 1024 * 1024;   // 10MB
    var maxW = opts.maxW || 1600;                       // 长边
    var quality = opts.quality || 0.85;
    var accept = ".jpg,.jpeg,.png,.webp";

    var wrap = document.createElement("div");
    wrap.className = "field";
    wrap.innerHTML =
      '<label>' + esc(opts.label || "封面图") + ' <span class="opt">（可选，不上传则用渐变封面）</span></label>' +
      '<div class="upload-row">' +
        '<span class="thumb" id="thumb-' + panelId + '"></span>' +
        '<input type="file" accept="' + accept + '" id="file-' + panelId + '">' +
        '<span class="path" id="path-' + panelId + '"></span>' +
        '<button class="btn sm" type="button" id="clear-' + panelId + '">移除图片</button>' +
      "</div>" +
      '<p class="spec">规格要求：JPG / PNG / WebP，单张 ≤ 10MB，推荐横图 800×600 及以上。上传后自动压缩为 WebP（长边 ' + maxW + 'px、质量 ' + Math.round(quality * 100) + '%）并存入 assets/uploads/。</p>';

    var fileInput = wrap.querySelector("#file-" + panelId);
    var thumb = wrap.querySelector("#thumb-" + panelId);
    var pathEl = wrap.querySelector("#path-" + panelId);

    function refresh(value) {
      var v = value || getPath(CONTENT, dataPath) || "";
      pathEl.textContent = v || "（未上传，使用默认渐变封面）";
      thumb.innerHTML = v
        ? '<img src="' + esc(v) + '" alt="">'
        : esc(opts.emoji || "🖼️");
    }

    fileInput.addEventListener("change", async function () {
      var file = fileInput.files[0];
      if (!file) return;
      if (!/image\/(jpeg|png|webp)/.test(file.type)) {
        toast("仅支持 JPG / PNG / WebP 格式", "err");
        fileInput.value = "";
        return;
      }
      if (file.size > maxBytes) {
        toast("图片超过 " + Math.round(maxBytes / 1024 / 1024) + "MB，请先压缩", "err");
        fileInput.value = "";
        return;
      }
      try {
        var blob = await compressImage(file, maxW, quality);
        var name = "uploads/" + Date.now().toString(36) + "-" + Math.floor(Math.random() * 1e6).toString(36) + ".webp";
        if (DIR) {
          var upDir = await DIR.getDirectoryHandle("assets/uploads", { create: true });
          await writeImage(upDir, name.replace("uploads/", ""), blob);
          setPath(CONTENT, dataPath, "assets/" + name);
          dirty = true;
          refresh();
          toast("图片已保存到 assets/" + name, "ok");
        } else {
          // 未连接文件夹：下载图片 + 记录路径
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = name.replace("uploads/", "");
          a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
          setPath(CONTENT, dataPath, "assets/" + name);
          dirty = true;
          refresh();
          toast("图片已下载 —— 请放入 assets/uploads/ 目录后保存", "ok");
        }
      } catch (e) {
        toast("图片处理失败：" + e.message, "err");
      }
      fileInput.value = "";
    });

    wrap.querySelector("#clear-" + panelId).addEventListener("click", function () {
      setPath(CONTENT, dataPath, "");
      dirty = true;
      refresh();
    });

    refresh();
    return wrap;
  }

  function compressImage(file, maxW, quality) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        URL.revokeObjectURL(url);
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxW / Math.max(w, h));
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(w * scale);
        canvas.height = Math.round(h * scale);
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        if (canvas.toBlob) {
          canvas.toBlob(function (b) {
            if (b) resolve(b); else reject(new Error("压缩失败"));
          }, "image/webp", quality);
        } else {
          reject(new Error("浏览器不支持图片压缩"));
        }
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("图片无法读取")); };
      img.src = url;
    });
  }

  /* ================= 通用表单字段 ================= */
  function field(opts) {
    opts = opts || {};
    var type = opts.type || "text";
    var d = document.createElement("div");
    d.className = "field";
    var labelHtml = opts.label ? "<label>" + esc(opts.label) + " <span class='opt'>" + esc(opts.opt || "") + "</span></label>" : "";
    var inputHtml;
    if (type === "textarea") {
      inputHtml = "<textarea " + (opts.rows ? "rows='" + opts.rows + "'" : "") + " data-path='" + esc(opts.path) + "' placeholder='" + esc(opts.placeholder || "") + "'></textarea>";
    } else if (type === "select") {
      inputHtml = "<select data-path='" + esc(opts.path) + "'>" +
        (opts.options || []).map(function (o) {
          return "<option value='" + esc(o.v) + "'>" + esc(o.t) + "</option>";
        }).join("") + "</select>";
    } else {
      inputHtml = "<input type='" + type + "' data-path='" + esc(opts.path) + "' placeholder='" + esc(opts.placeholder || "") + "'>";
    }
    d.innerHTML = labelHtml + inputHtml;
    if (opts.hint) d.insertAdjacentHTML("beforeend", "<p class='spec'>" + esc(opts.hint) + "</p>");
    return d;
  }

  function bindForm(scope) {
    scope.querySelectorAll("[data-path]").forEach(function (el) {
      var v = getPath(CONTENT, el.dataset.path);
      el.value = v == null ? "" : v;
      el.addEventListener("input", function () {
        setPath(CONTENT, el.dataset.path, el.value);
        dirty = true;
      });
    });
  }

  /* ================= 列表项组件 ================= */
  function listEditor(opts) {
    // opts: { container, itemsPath, titleOf(item), renderItem(itemEl, item, path), emptyHint, addDefaults }
    var wrap = document.createElement("div");
    wrap.className = "list-editor";

    function renderList() {
      wrap.innerHTML = "";
      var items = getPath(CONTENT, opts.itemsPath) || [];
      items.forEach(function (item, i) {
        var box = document.createElement("div");
        box.className = "item";
        var head = document.createElement("div");
        head.className = "item-head";
        head.innerHTML = '<span class="idx">#' + (i + 1) + "</span><span>" + esc(opts.titleOf(item)) + "</span>";
        var actions = document.createElement("span");
        actions.className = "item-actions";
        actions.innerHTML =
          '<button class="btn sm" type="button" data-act="up">↑</button>' +
          '<button class="btn sm" type="button" data-act="down">↓</button>' +
          '<button class="btn sm danger" type="button" data-act="del">删除</button>';
        head.appendChild(actions);
        box.appendChild(head);

        var body = document.createElement("div");
        opts.renderItem(body, item, opts.itemsPath + "." + i);
        box.appendChild(body);
        wrap.appendChild(box);

        actions.querySelector('[data-act="up"]').addEventListener("click", function () {
          if (i === 0) return;
          var arr = getPath(CONTENT, opts.itemsPath);
          var t = arr[i]; arr[i] = arr[i - 1]; arr[i - 1] = t;
          dirty = true; renderList();
        });
        actions.querySelector('[data-act="down"]').addEventListener("click", function () {
          var arr = getPath(CONTENT, opts.itemsPath);
          if (i >= arr.length - 1) return;
          var t = arr[i]; arr[i] = arr[i + 1]; arr[i + 1] = t;
          dirty = true; renderList();
        });
        actions.querySelector('[data-act="del"]').addEventListener("click", function () {
          var arr = getPath(CONTENT, opts.itemsPath);
          arr.splice(i, 1);
          dirty = true; renderList();
        });
      });

      var add = document.createElement("button");
      add.className = "add-btn";
      add.textContent = "＋ " + (opts.addText || "添加一项");
      add.addEventListener("click", function () {
        var arr = getPath(CONTENT, opts.itemsPath);
        arr.push(deepClone(opts.addDefaults));
        dirty = true; renderList();
      });
      wrap.appendChild(add);

      if (!items.length && opts.emptyHint) {
        var e = document.createElement("p");
        e.className = "spec";
        e.style.padding = "8px 2px";
        e.textContent = opts.emptyHint;
        wrap.insertBefore(e, add);
      }
    }

    renderList();
    return wrap;
  }

        // 视频源

        sp.className = "field";
        sp.innerHTML = "<label>▶ 播放地址 <span class='opt'>（必填）</span></label>";
        var srcBox = document.createElement("div");
        srcBox.className = "row";
        srcBox.appendChild(field({
          label: "地址类型", type: "select",

            { v: "video", t: "mp4 直链" }
          ],
          path: path + ".srcType"
        }));
        srcBox.appendChild(field({ label: "播放地址", type: "url", path: path + ".src", placeholder: "https://player.bilibili.com/player.html?bvid=…" }));

        body.appendChild(sp);

        // 同步 sources 映射
        function syncSource() {
          var src = item.src;
          var type = item.srcType || "iframe";
          var sources = CONTENT.videos.sources;
          if (!src) { delete sources[item.key]; }
          else { sources[item.key] = { src: src, type: type }; }
        }
        var savedSrc = (CONTENT.videos.sources && CONTENT.videos.sources[item.key]) || {};
        body.querySelectorAll("[data-path]").forEach(function (el) {
          if (el.dataset.path === path + ".src" || el.dataset.path === path + ".srcType") {
            el.addEventListener("input", function () {
              setPath(CONTENT, el.dataset.path, el.value);
              syncSource();
              dirty = true;
            });
            if (el.dataset.path === path + ".src") el.value = savedSrc.src || "";
            if (el.dataset.path === path + ".srcType") el.value = savedSrc.type || "iframe";
          }
        });
      }
    });
    p2.appendChild(l);
    main.appendChild(p2);
  }

    if (!CONTENT) return;
    renderPanelSite();
    switchPanel("site");
  }

  /* ================= 面板切换 ================= */
  function switchPanel(name) {
    var map = {
      site: renderPanelSite, hero: renderPanelHero,
      projects: function () { renderPanelCards("projects", "📁 精选项目", "项目卡片：封面、分类、标题、简介与跳转链接。"); },
      courses: renderPanelCourses,
      videos: renderPanelVideos,
      unboxing: function () { renderPanelCards("unboxing", "📦 数码产品开箱", "开箱卡片：封面、分类、标题、简介与跳转链接。"); },
      about: renderPanelAbout,
      guide: renderPanelGuide
    };
    document.querySelectorAll(".sidebar button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.panel === name);
    });
    if (map[name]) map[name]();
  }

  $("sidebar").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-panel]");
    if (b) {
      if (!CONTENT && b.dataset.panel !== "guide") {
        toast("请先加载内容（点右上「重新加载」或「连接网站文件夹」）", "err");
        return;
      }
      switchPanel(b.dataset.panel);
    }
  });

  /* ================= 预览 ================= */
  $("btn-preview").addEventListener("click", function () {
    window.open("../index.html", "_blank");
  });

  /* ================= 重新加载 ================= */
  $("btn-load").addEventListener("click", async function () {
    if (dirty && !confirm("当前有未保存的修改，重新加载将丢弃，确定继续？")) return;
    if (DIR) { await loadFromDir(); }
    else { await loadViaFetch(); }
  });

  /* ================= 启动 ================= */
  window.addEventListener("beforeunload", function (e) {
    if (dirty) {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  // 初始化：优先文件夹（浏览器无持久句柄，每次需手动连接）；否则 HTTP 加载
  if (location.protocol === "file:") {
    toast("请通过 http://localhost 打开本页（双击启动.command），或点「连接网站文件夹」", "err");
    $("conn-state").innerHTML = '<span class="dot gray"></span>file:// 模式，建议连接文件夹';
  } else {
    loadViaFetch();
  }
})();
